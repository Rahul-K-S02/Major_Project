name: GeneRisk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install dependencies
        run: |
          pip install pandas numpy xgboost scikit-learn shap matplotlib reportlab python-dotenv
          pip install fastapi uvicorn pydantic requests

      - name: Run pipeline test (no API keys needed)
        run: python tests/test_pipeline.py
        env:
          GROQ_API_KEY: ""   # Tests run without LLM in CI
          CLINVAR_DB_PATH: "./data/clinvar.db"

  lint-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - run: npm run lint || true    # lint errors don't block CI
